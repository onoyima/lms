# TLS termination and load balancing across the app servers.
upstream exams_app {
    least_conn;
    server app1:9000 max_fails=3 fail_timeout=10s;
    server app2:9000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /var/www/platform/public;
    index index.php;
    client_max_body_size 30m;           # large files go through resumable 4 MB pieces
    server_tokens off;

    location = /login { limit_req zone=login burst=5 nodelay; try_files $uri /index.php?$query_string; }
    location /build/  { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /vendor/ { expires 30d; try_files $uri =404; }
    location ~ /\.(?!well-known) { deny all; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass exams_app;
        fastcgi_keep_conn on;
        fastcgi_next_upstream error timeout http_503;   # a failed app server is skipped
        fastcgi_read_timeout 60s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/platform/public/index.php;
        fastcgi_param HTTPS on;
    }
}
