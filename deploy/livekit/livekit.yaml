# LiveKit server settings for the platform. Keys come from LIVEKIT_KEYS (see docker-compose.yml).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
redis:
  address: 127.0.0.1:6379
  password: ${REDIS_PASSWORD}
room:
  empty_timeout: 300
  max_participants: 600          # candidates + phones + proctors in one sitting
webhook:
  api_key: ${LIVEKIT_API_KEY}
  urls:
    - https://YOUR-PLATFORM-DOMAIN/api/livekit/webhook   # starts recordings, reports lost cameras
logging:
  level: info
